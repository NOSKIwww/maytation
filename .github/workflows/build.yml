          	<key>CFBundleExecutable</key>
          	<string>MaytationPrefs</string>
          	<key>CFBundleIdentifier</key>
          	<string>local.maytationprefs</string>
          	<key>CFBundleInfoDictionaryVersion</key>
          	<string>6.0</string>
          	<key>CFBundleName</key>
          	<string>MaytationPrefs</string>
          	<key>CFBundlePackageType</key>
          	<string>BNDL</string>
          	<key>CFBundleShortVersionString</key>
          	<string>0.1.0</string>
          	<key>CFBundleVersion</key>
          	<string>1</string>
          	<key>NSPrincipalClass</key>
          	<string>MYTRootListController</string>
          </dict>
          </plist>
          MAYEOF
          ls -la

      - name: Install tools
        run: brew install ldid dpkg

      - name: Compile tweak (plain clang from Xcode)
        run: |
          set -ex
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON="-isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -fmodules -Wno-deprecated-declarations -O2 -framework UIKit -framework Foundation"
          TW="$COMMON -dynamiclib -framework CoreMotion -framework QuartzCore -install_name /Library/MobileSubstrate/DynamicLibraries/Maytation.dylib"
          if xcrun --sdk iphoneos clang -arch arm64 -arch arm64e $TW Tweak.m -o Maytation.dylib; then
            echo "built arm64 + arm64e"
          else
            echo "arm64e failed, building arm64 only"
            xcrun --sdk iphoneos clang -arch arm64 $TW Tweak.m -o Maytation.dylib
          fi
          ldid -S Maytation.dylib
          lipo -info Maytation.dylib
          otool -L Maytation.dylib

      - name: Compile settings pane (optional, falls back to a simple pane)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PF="-isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -Wno-deprecated-declarations -O2 -bundle -undefined dynamic_lookup -framework UIKit -framework Foundation"
          if xcrun --sdk iphoneos clang -arch arm64 -arch arm64e $PF PrefsController.m -o MaytationPrefs \
             || xcrun --sdk iphoneos clang -arch arm64 $PF PrefsController.m -o MaytationPrefs; then
            ldid -S MaytationPrefs && lipo -info MaytationPrefs && touch prefs_ok
          else
            echo "settings pane failed to compile, using the simple pane"
          fi

      - name: Build deb (iphoneos-arm64e, rootful /Library)
        run: |
          set -ex
          mkdir -p pkg/DEBIAN pkg/Library/MobileSubstrate/DynamicLibraries pkg/Library/PreferenceLoader/Preferences out
          cp Maytation.dylib Maytation.plist pkg/Library/MobileSubstrate/DynamicLibraries/
          chmod 755 pkg/Library/MobileSubstrate/DynamicLibraries/Maytation.dylib
          if [ -f prefs_ok ]; then
            B=pkg/Library/PreferenceBundles/MaytationPrefs.bundle
            mkdir -p "$B"
            cp MaytationPrefs "$B/MaytationPrefs"
            chmod 755 "$B/MaytationPrefs"
            cp PrefsInfo.plist "$B/Info.plist"
            cp RootEN.plist RootRU.plist "$B/"
            cp PrefsEntry.plist pkg/Library/PreferenceLoader/Preferences/Maytation.plist
          else
            cp PrefsFallback.plist pkg/Library/PreferenceLoader/Preferences/Maytation.plist
          fi
          cp control pkg/DEBIAN/control
          echo "Installed-Size: $(du -sk pkg/Library | cut -f1)" >> pkg/DEBIAN/control
          dpkg-deb --root-owner-group -Zlzma -b pkg out/maytation_iphoneos-arm64e.deb || dpkg-deb --root-owner-group -Zgzip -b pkg out/maytation_iphoneos-arm64e.deb
          dpkg-deb -I out/maytation_iphoneos-arm64e.deb
          dpkg-deb -c out/maytation_iphoneos-arm64e.deb

      - uses: actions/upload-artifact@v4
        with:
          name: maytation-deb
          path: out/*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maytation build ${{ github.run_number }}
          files: out/*.deb
